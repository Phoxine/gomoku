7. Containers and infrastructure: Check Docker and Compose configuration for insecure privileges, exposed services, image and dependency risks, build correctness, and worktree project, network, and database isolation. Check scripts for unsafe inputs, destructive operations, and error handling.

Report only actionable findings, ordered by severity: [Critical] for security or hard boundary violations, [Warning] for potential bugs or performance issues, and [Nitpick] for style. Give each finding a file path, line number or function, and concrete fix. If there are no findings, reply: "Review passed; no issues found."
