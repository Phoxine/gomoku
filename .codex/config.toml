model = "gpt-6-luna"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

project_root_markers = [".git"]

[agents]
max_threads = 4
max_depth = 1

[agents.test_doc_worker]
description = "Write unit tests and update English feature documentation for new or changed services."
config_file = "agents/test_doc_worker.toml"

[agents.code_reviewer]
description = "Read-only reviewer for security, architecture, Gomoku rules, Python types, and performance."
config_file = "agents/code_reviewer.toml"

[agents.test_runner]
description = "Run tests in isolated containers and report concise failure diagnostics."
config_file = "agents/test_runner.toml"

[agents.tech_researcher]
description = "Read-only technical researcher assessing compatibility, dependencies, risks, and trade-offs."
config_file = "agents/tech_researcher.toml"

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
# Host prerequisite: uv must be installed before using this repository's Codex hooks.
command = "command -v uv >/dev/null 2>&1 || { echo 'uv is required on the host for repository Codex hooks.' >&2; exit 2; }; uv run --no-project --no-sync --no-python-downloads python \"$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.py\" || exit 2"
timeout = 30
statusMessage = "Checking command policy"

[[hooks.Stop]]
matcher = ".*"

[[hooks.Stop.hooks]]
type = "command"
command = "bash .codex/hooks/stop-validation.sh"
timeout = 60
statusMessage = "Running final validation"
