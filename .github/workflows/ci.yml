name: Gomoku CI Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  documentation:
    name: Documentation Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown links and indexes
        run: python3 scripts/check_docs.py
      - name: Test documentation checker
        run: python3 -m unittest discover -s scripts/tests -p check_docs_test.py

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start Environment
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          cp src/.env.example src/.env
          docker compose up -d db app

      - name: Wait for Postgres to be ready
        run: |
          docker compose exec -T db sh -c "until pg_isready -U postgres -d gomoku; do echo waiting for database; sleep 1; done"

      - name: Run Ruff Lint
        run: docker compose exec -T app uv run ruff check app tests

      - name: Run Ruff Format Check
        run: docker compose exec -T app uv run ruff format --check app tests

      - name: Test coverage report tooling
        run: python3 -m unittest discover -s scripts/tests -p coverage_report_test.py

      - name: Run Tests with Coverage
        id: python-tests
        run: docker compose exec -T app uv run pytest --cov=app --cov-config=/workspace/pyproject.toml --cov-report=xml tests

      - name: Run Game Web Interaction Tests
        run: node --test scripts/tests/game_web_interactions_test.js

      - name: Check Python coverage report
        id: coverage-report
        if: ${{ !cancelled() && steps.python-tests.outcome == 'success' }}
        continue-on-error: true
        run: bash scripts/check-coverage-report.sh src/coverage.xml

      - name: Upload Python coverage report
        if: ${{ !cancelled() && steps.coverage-report.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage
          path: src/coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Python line coverage minimum
        if: ${{ !cancelled() && steps.python-tests.outcome == 'success' }}
        shell: bash
        run: python3 scripts/summarize_coverage.py src/coverage.xml --fail-under 90 | tee -a "$GITHUB_STEP_SUMMARY"

  docker-security:
    name: Docker Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build local image for scanning
        run: docker build -t gomoku-app:latest -f docker/Dockerfile .

      - name: Report all high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gomoku-app:latest
          format: table
          exit-code: "0"
          ignore-unfixed: false
          severity: CRITICAL,HIGH

      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gomoku-app:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
