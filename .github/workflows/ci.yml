name: Gomoku CI Pipeline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Environment
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          cp src/.env.example src/.env
          docker compose up -d db app

      - name: Wait for Postgres to be ready
        run: |
          docker compose exec -T db sh -c "until pg_isready -U postgres -d gomoku; do echo waiting for database; sleep 1; done"

      - name: Run Ruff Lint
        run: docker compose exec -T app uv run ruff check app tests

      - name: Run Ruff Format Check
        run: docker compose exec -T app uv run ruff format --check app tests

      - name: Run Tests with Coverage
        run: docker compose exec -T app uv run pytest --cov=app --cov-report=xml tests

  docker-security:
    name: Docker Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build local image for scanning
        run: docker build -t gomoku-app:latest -f docker/Dockerfile .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gomoku-app:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
