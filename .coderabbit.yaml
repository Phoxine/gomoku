language: "en-US" # Have the AI respond in English
reviews:
  profile: "chill"
  request_changes_workflow: true
  pre_merge_checks:
    custom_checks:
      - name: Major issues
        mode: error
        instructions: |
          Fail if the pull request contains any unresolved critical or major
          bug, security vulnerability, data loss risk, or issue that can break
          a core user flow. Pass only when no such issues remain.
  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        You are a senior full-stack Python architect. Follow the root-level `AGENTS.md` requirements.
        Pay particular attention to:
        1. Naming conventions for variables, functions, and classes.
        2. Strict use of native Python 3.14 type hints.
        3. Whether core Gomoku logic is isolated from Django and implemented in `services/`.
        4. Potential SQL injection risks.
