[project]
name = "gomoku"
version = "0.1.0"
description = "A web-based Gomoku game."
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.3",
    "psycopg[binary]==3.3.8",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
